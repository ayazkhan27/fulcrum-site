<meta charset="utf-8">
<title>Fulcrum — brand stinger</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  Standalone Fulcrum stinger. Everything is inlined, so this file works offline,
  from a USB stick, or embedded in a deck. No build step and no network.

  Beats come off the waveform of the voice line, not from guesswork:
    0.16s  "Fulcrum"             peaks and wordmark drop and seat
    1.82s  "Precision in motion" tagline slides in from the left
    3.56s  "Everywhere"          glint sweeps, masked to the artwork alpha

  ?theme=light  renders the inverted cut on paper.
  ?loop=1       replays continuously, for a kiosk or a loop reel.
-->
<style>
  :root { --ground:#15181b; --ink:#f0f2f1; }
  :root[data-theme=light] { --ground:#f4f6f5; --ink:#101314; }
  html,body { height:100%; margin:0; background:var(--ground); }
  body { display:grid; place-items:center; font-family:system-ui,sans-serif; }
  #stage { width:min(52rem,88vw); position:relative; }
  .row { display:flex; align-items:center; gap:3.5%; }
  .row > :first-child { flex:0 0 26%; }
  .row > :last-child  { flex:1 1 auto; }
  .piece { position:relative; display:block; }
  .piece img { width:100%; height:auto; }
  .drop { display:block; opacity:0; transform:translate3d(0,-55%,0); }
  .drop.in { animation:drop .62s cubic-bezier(.2,1.5,.35,1) forwards; }
  .drop.late.in { animation-delay:.09s; }
  @keyframes drop { 0%{opacity:0;transform:translate3d(0,-55%,0)} 60%{opacity:1}
                     100%{opacity:1;transform:none} }
  .tag { display:block; margin:1.6% 0 0 auto; width:52%; opacity:0;
          transform:translate3d(-28%,0,0); }
  .tag.in { animation:slide .7s cubic-bezier(.16,.9,.3,1) forwards; }
  @keyframes slide { to { opacity:1; transform:none } }
  .glint { position:absolute; inset:0; pointer-events:none; opacity:0;
    background-image:linear-gradient(100deg,transparent 42%,rgb(255 255 255/.9) 50%,transparent 58%);
    background-repeat:no-repeat; background-size:260% 100%; background-position:-130% 0;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-size:100% 100%;  mask-size:100% 100%; }
  .glint.on { animation:glint .95s ease-out forwards; }
  /* Gradient is wider than its box, so a falling offset sweeps left to right. */
  @keyframes glint { 0%{opacity:0;background-position:130% 0} 12%{opacity:1}
                      88%{opacity:1} 100%{opacity:0;background-position:-130% 0} }
  .on-light { display:none; }
  :root[data-theme=light] .on-dark { display:none; }
  :root[data-theme=light] .on-light { display:block; }
  #start { position:fixed; inset:0; display:grid; place-items:center; gap:2rem;
    background:var(--ground); cursor:pointer; }
  #start button { font:600 13px/1 system-ui,sans-serif; letter-spacing:.11em;
    text-transform:uppercase; padding:.75rem 1.5rem; cursor:pointer;
    color:var(--ink); background:none; border:1px solid var(--ink); }
  @media (prefers-reduced-motion:reduce) { .drop,.tag { opacity:1; transform:none; animation:none } }
</style>

  glints.forEach(g => g.classList.remove('on'));
  void document.body.offsetWidth;               // restart the CSS animations
  audio.currentTime = 0; audio.play().catch(()=>{});
  setTimeout(() => drops.forEach(d => d.classList.add('in')), BEATS.drop);
  setTimeout(() => tag.classList.add('in'), BEATS.tagline);
  setTimeout(() => glints.forEach(g => g.classList.add('on')), BEATS.shine);
  if (q.get('loop') === '1') setTimeout(run, BEATS.out + 1200);
}
document.getElementById('start').addEventListener('click', function () {
  this.remove();                                 // the click is the gesture that lets audio start
  run();
});
</script>
